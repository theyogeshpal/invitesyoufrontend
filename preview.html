<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Invitation Card Preview & Demo - Typwrite</title>
    <meta name="description" content="Live mobile interactive preview of custom digital invitation card with 3D envelope opening, music, and WhatsApp RSVP.">
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #0f1016;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
        }
        .preview-wrapper {
            position: relative;
            width: 100%; max-width: 440px; height: 100vh;
            background: #fff;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        
        .back-btn {
            position: absolute; top: 18px; left: 18px; z-index: 100;
            background: rgba(0,0,0,0.65); color: white; border: none;
            backdrop-filter: blur(8px);
            padding: 8px 16px; border-radius: 50px; font-size: 13px;
            cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px;
            font-weight: 600; transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.85); }

        .demo-link-btn {
            position: absolute; top: 18px; right: 18px; z-index: 100;
            background: #7c3aed; color: white; border: none;
            padding: 8px 16px; border-radius: 50px; font-size: 13px;
            cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px;
            font-weight: 700; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: all 0.2s;
        }
        .demo-link-btn:hover { transform: translateY(-2px); background: #6d28d9; }
        
        .cover-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2d1b05 0%, #150c02 100%);
            z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.9s cubic-bezier(0.77, 0, 0.175, 1);
            color: #f5e6c8; text-align: center; padding: 24px;
        }
        .cover-screen.open-up {
            transform: translateY(-100%);
        }
        
        .seal-button {
            width: 170px; height: 170px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.3s;
            margin-bottom: 24px;
        }
        .seal-button:hover { transform: scale(1.05); }
        .seal-button h2, .seal-button .seal-text { margin: 0; font-family: 'Playfair Display', serif; font-size: 38px; color: #d4af37; letter-spacing: 2px; font-weight: 700; display: block; }
        .seal-button p { margin: 8px 0 0 0; font-size: 11px; letter-spacing: 2px; color: #e8d7a5; text-transform: uppercase; font-weight: 700; }
        
        .invite-content {
            height: 100%; width: 100%;
            overflow-y: auto; overflow-x: hidden;
            scroll-behavior: smooth;
            background: #faf8f5;
        }
        .invite-content::-webkit-scrollbar { display: none; }
        
        .invite-image { width: 100%; display: block; border: none; margin: 0; padding: 0; min-height: 250px; object-fit: cover; }
        
        .card-details-banner {
            padding: 24px 20px;
            background: #fff;
            border-top: 1px solid #eee;
            text-align: center;
        }
        .card-details-banner h3 { margin: 0 0 6px 0; font-size: 18px; color: #222; }
        .card-details-banner p { margin: 0 0 12px 0; font-size: 13px; color: #666; }

        .order-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60;
            background: #25d366; color: white; border: none;
            padding: 13px 26px; border-radius: 50px; font-size: 15px; font-weight: bold;
            cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4);
            white-space: nowrap; transition: transform 0.2s;
        }
        .order-btn:hover { transform: translateX(-50%) translateY(-2px); }
        
        .music-btn {
            position: absolute; bottom: 20px; right: 20px; z-index: 60;
            background: #d4af37; color: white; border: none;
            width: 48px; height: 48px; border-radius: 50%; font-size: 16px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
        }
        
        .petals {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background-image: radial-gradient(#d4af37 1px, transparent 1px);
            background-size: 40px 40px; opacity: 0.15;
        }
    </style>
</head>
<body>
    <div class="petals"></div>
    
    <div class="preview-wrapper">
        <a href="templates.html" class="back-btn"><i class="fas fa-arrow-left"></i> All Cards</a>
        <a href="#" id="liveDemoBtn" class="demo-link-btn" style="display:none;"><i class="fas fa-play"></i> Live Demo</a>
        
        <div class="cover-screen" id="coverScreen">
            <div class="seal-button" onclick="openInvitation()">
                <span id="sealInitials" class="seal-text">DIGITAL</span>
                <p>Tap to Open</p>
            </div>
            <h1 id="coverTitle" style="font-family:'Playfair Display',serif; font-size:24px; margin:0 0 6px 0;">Digital Invitation Card</h1>
            <p id="coverSub" style="font-size:13px; color:rgba(245,230,200,0.7); margin:0;">Swipe up or tap above to view the invitation</p>
        </div>
        
        <div class="invite-content" id="inviteContent">
            <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=800&q=80" id="cardImg1" class="invite-image" alt="Digital Card Front">
            <img src="https://images.unsplash.com/photo-1543883665-27a36c646b5a?auto=format&fit=crop&w=800&q=80" id="cardImg2" class="invite-image" alt="Digital Card Details">
            
            <div class="card-details-banner">
                <h3 id="cardTitle">Digital Invitation Card</h3>
                <p id="cardPrice" style="font-size:16px; font-weight:bold; color:#7c3aed;">₹3,999</p>
                <div style="margin-bottom:60px;">
                    <a href="#" id="openFullDemoBtn" style="color:#7c3aed; font-weight:700; text-decoration:none; font-size:14px; display:inline-flex; align-items:center; gap:6px;">
                        <i class="fas fa-play-circle"></i> Open Full Interactive 3D Demo →
                    </a>
                </div>
            </div>
        </div>
        
        <a href="https://wa.me/917817095043" id="orderBtn" target="_blank" class="order-btn"><i class="fab fa-whatsapp"></i> Order This Card</a>
        <button class="music-btn" onclick="toggleMusic()"><i class="fas fa-music" id="musicIcon"></i></button>
    </div>

    <script src="assets/js/env.js"></script>
    <script>
        const API_BASE = (window.__ENV__ && window.__ENV__.API_URL) || 'http://localhost:5000/api';
        const params = new URLSearchParams(window.location.search);
        const cardId = params.get('id');

        function openInvitation() {
            document.getElementById('coverScreen').classList.add('open-up');
        }

        async function loadCardDetails() {
            if (!cardId) return;
            try {
                const res = await fetch(`${API_BASE}/templates/${cardId}`);
                if (!res.ok) return;
                const card = await res.json();
                
                document.getElementById('coverTitle').textContent = card.title;
                document.getElementById('cardTitle').textContent = card.title;
                document.getElementById('cardPrice').textContent = `₹${Number(card.price).toLocaleString('en-IN')}`;
                
                if (card.imageFront) document.getElementById('cardImg1').src = card.imageFront;
                if (card.imageBack) document.getElementById('cardImg2').src = card.imageBack;

                const demoUrl = card.demoUrl || `view.html?tmpl=t1&event=${encodeURIComponent(card.category || 'Wedding')}&names=${encodeURIComponent(card.title)}`;
                
                const liveDemoBtn = document.getElementById('liveDemoBtn');
                liveDemoBtn.href = demoUrl;
                liveDemoBtn.style.display = 'flex';

                const openFullDemoBtn = document.getElementById('openFullDemoBtn');
                openFullDemoBtn.href = demoUrl;

                const orderBtn = document.getElementById('orderBtn');
                const phone = (window.__ENV__ && window.__ENV__.WHATSAPP_NUMBER) || '917817095043';
                orderBtn.href = `https://wa.me/${phone}?text=${encodeURIComponent(`Hi Typwrite! I want to order the "${card.title}" digital invitation card (Price: ₹${card.price}). Please guide me!`)}`;
            } catch (e) {
                console.error(e);
            }
        }
        loadCardDetails();
        
        let musicPlaying = false;
        function toggleMusic() {
            musicPlaying = !musicPlaying;
            const icon = document.getElementById('musicIcon');
            icon.className = musicPlaying ? 'fas fa-pause' : 'fas fa-music';
        }
    </script>
</body>
</html>
